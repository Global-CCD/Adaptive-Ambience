<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive Ambience</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎧 Adaptive Ambience</h1>
      <p>ANC Inverse + IR Convolution for Multi-Room Ambience</p>
    </header>

    <div class="controls">
      <div class="control-group">
        <button id="startMic" class="btn btn-primary">🎤 Start Microphone</button>
        <button id="stopMic" class="btn btn-secondary" disabled>⏹️ Stop</button>
      </div>

      <div class="control-group">
        <label for="volume">Masking Volume:</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.3">
        <span id="volumeValue">30%</span>
      </div>

      <div class="control-group">
        <label>
          <input type="checkbox" id="enableIR">
          Enable IR Convolution
        </label>
        <input type="file" id="irFile" accept=".wav" disabled>
        <span id="irStatus">No IR loaded</span>
      </div>

      <div class="control-group">
        <label for="noiseType">Noise Type:</label>
        <select id="noiseType">
          <option value="white">White Noise</option>
          <option value="pink" selected>Pink Noise</option>
          <option value="brown">Brown Noise</option>
        </select>
      </div>
    </div>

    <div class="visualizers">
      <div class="visualizer">
        <h3>Microphone Spectrum</h3>
        <canvas id="spectrum" width="800" height="200"></canvas>
      </div>
      <div class="visualizer">
        <h3>Output VU Meter</h3>
        <canvas id="vuMeter" width="800" height="50"></canvas>
      </div>
    </div>

    <div class="presets">
      <h3>Presets</h3>
      <div class="preset-controls">
        <input type="text" id="presetName" placeholder="Preset Name">
        <button id="savePreset" class="btn btn-small">💾 Save</button>
        <select id="loadPreset">
          <option value="">-- Load Preset --</option>
        </select>
        <button id="deletePreset" class="btn btn-small btn-danger">🗑️ Delete</button>
        <button id="exportPreset" class="btn btn-small">📤 Export</button>
        <input type="file" id="importPreset" accept=".json" hidden>
        <button id="importPresetBtn" class="btn btn-small">📥 Import</button>
      </div>
    </div>

    <div class="status">
      <p id="statusMessage">Ready to start.</p>
    </div>
  </div>

  <audio id="audioOutput" hidden></audio>

  <div id="errorToast" class="toast" hidden>
    <span id="errorMessage"></span>
    <button id="closeToast">×</button>
  </div>

  <script src="js/error-handler.js" type="module"></script>
  <script src="js/preset-manager.js" type="module"></script>
  <script src="js/visualizer.js" type="module"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
